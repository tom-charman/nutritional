[project]
name = "nutritional"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "authlib>=1.6.6",
    "dash>=3.3.0",
    "dash-auth>=2.3.0",
    "dash-bootstrap-components>=2.0.4",
    "google-api-python-client>=2.187.0",
    "google-auth>=2.43.0",
    "google-auth-httplib2>=0.2.1",
    "google-auth-oauthlib>=1.2.2",
    "gunicorn>=23.0.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.10.0",
    "python-dotenv>=1.2.1",
    "requests[security]>=2.32.5",
    "seaborn>=0.13.2",
    "sqlmodel>=0.0.31",
]

[dependency-groups]
dev = [
    "numpy>=2.3.4",
    "pre-commit>=4.4.0",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "ty>=0.0.1a27",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"nutritional/__main__.py" = ["E402"]  # Module imports after dotenv setup
"nutritional/app.py" = ["E402"]  # Layout/callbacks imported after app creation
"nutritional/pages/*.py" = ["E402"]  # Page imports after dash.register_page
"tests/**/*.py" = ["F401", "F811"]  # Allow unused imports in tests

[tool.ty]
# Configure ty type checker to use the project's virtual environment
environment = { python = ".venv" }
